# Production: Ubuntu server behind the existing nginx (no Caddy). Nothing is published except the backend on
# 127.0.0.1:${APP_PORT}, which nginx proxies to. Installed and started by deploy/install.sh.
name: thechannel

services:
  redis:
    image: apache/kvrocks:2.17.0
    restart: unless-stopped
    mem_limit: ${REDIS_MEM:-256m}
    oom_score_adj: 200          # on a shared server the kernel stops these containers before other services
    user: root
    command: -c /kvrocks.conf
    volumes:
      - kvrocks_sock:/data
      - kvrocks_data:/var/lib/kvrocks
      - ./kvrocks.conf:/kvrocks.conf:ro

  moderation:
    # Built on the developer computer and loaded on the server (deploy/upload.ps1), or built here.
    image: thechannel-moderation:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: moderation/Dockerfile
    restart: unless-stopped
    environment:
      THREADS: "${MODERATION_THREADS:-3}"
      FFMPEG_THREADS: "${MODERATION_THREADS:-3}"
      BOX_MARGIN: "0.15"
      BEST_SIGHTINGS: "3"
      FACE_TILING: "0"
      BODY_MODEL: "1"
      MIN_BODY_PX: "64"
      DETECT_FPS: "5"
      HOLD_SEC: "0.6"
      TRACK_MAX_GAP_SEC: "1.5"
      MAX_OUTPUT_FPS: "30"
      OUTPUT_MAX_SIDE: "1280"
      MAX_VIDEO_SEC: "900"
      DECISION_V2: "${DECISION_V2:-0}"   # 1 = "likely man" queue for the moderators (automatic release unchanged), see moderation/README.md
      PERSON_BACKEND: "${PERSON_BACKEND:-ort}"   # ov = same YOLOX weights through OpenVINO, input shaped like the video (-43% analysis time), see moderation/README.md
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
    # Limits from .env (MODERATION_CPUS / MODERATION_MEM). Defaults suit a 4 vCPU / 8GB server; on the
    # 2 vCPU / 2GB server: 1 CPU and 600m, leaving the rest to nginx, the Node apps and WAHA.
    cpus: ${MODERATION_CPUS:-3}
    mem_limit: ${MODERATION_MEM:-1500m}
    oom_score_adj: 500          # first to be stopped if the server runs out of memory
    volumes:
      - ./channel_data:/files:ro
      - blurred:/blurred
      - ./moderation_models:/models:ro

  backend:
    image: thechannel-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      moderation:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEV_LOGIN: "false"        # never on in production (the backend refuses to start otherwise)
      # PRIVATE_SITE / ALLOWED_EMAILS come from .env (closed site, see backend/access.go)
      MODERATION_URL: http://moderation:8000
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:3000"
    mem_limit: 512m
    oom_score_adj: 300
    volumes:
      - ./channel_data:/app/files
      - blurred:/app/blurred:ro
      - kvrocks_sock:/app/data
      - ./logs:/app/logs
      - ./training:/app/training     # moderator corrections (crop + label) for training a model later

volumes:
  kvrocks_sock:
  kvrocks_data:
  blurred:
