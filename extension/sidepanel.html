<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שקיפות</title>
<style>
  /* One look everywhere: side panel, hover preview and docked window all use this page. */
  :root {
    --bg:#eef1f7; --card:#ffffff; --fg:#17203a; --muted:#6b7590; --line:#e0e5ef;
    --navy1:#0f2557; --navy2:#1d4ed8; --acc:#1d4ed8; --amber:#f59e0b; --soft:#f3f6fc;
    --pin:#fff7e0; --shadow:0 1px 2px rgba(15,37,87,.06), 0 4px 14px rgba(15,37,87,.06); --fs:15px; --head:60px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0d1322; --card:#161d30; --fg:#e8ecf6; --muted:#97a1bb; --line:#26304a; --soft:#1c2540;
      --acc:#7aa2ff; --amber:#fbbf24; --pin:#2a2412; --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0d1322; --card:#161d30; --fg:#e8ecf6; --muted:#97a1bb; --line:#26304a; --soft:#1c2540;
    --acc:#7aa2ff; --amber:#fbbf24; --pin:#2a2412; --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
  }
  :root[data-font="s"] { --fs:13px; }
  :root[data-font="l"] { --fs:18px; }
  * { box-sizing:border-box; }
  body { margin:0; font:var(--fs)/1.55 "Segoe UI", system-ui, Arial, sans-serif; background:var(--bg); color:var(--fg); }
  button, select, input { font:inherit; color:var(--fg); }
  button { cursor:pointer; }
  [hidden] { display:none !important; }

  /* header: same in every window */
  header { position:sticky; top:0; z-index:5; height:var(--head); display:flex; align-items:center; gap:10px; padding:0 12px;
    background:linear-gradient(135deg, var(--navy1), var(--navy2)); color:#fff; box-shadow:0 2px 10px rgba(15,37,87,.3); }
  .mark { width:36px; height:36px; border-radius:11px; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; flex:none; }
  .brand { flex:1; min-width:0; line-height:1.2; }
  .brand h1 { margin:0; font-size:1.12em; display:flex; align-items:center; gap:8px; }
  .brand small { opacity:.75; font-size:.76em; white-space:nowrap; }
  #chip { background:var(--amber); color:#241a00; border-radius:999px; font-size:.65em; font-weight:700; padding:1px 8px; }
  .tools { display:flex; gap:4px; }
  .tools button { background:rgba(255,255,255,.14); border:0; color:#fff; border-radius:999px; min-width:32px; height:32px; padding:0 10px; font-size:.9em; }
  .tools button:hover { background:rgba(255,255,255,.28); }

  /* status, pinned note */
  #status { padding:18px 16px; color:var(--muted); text-align:center; }
  .pin { margin:10px 12px 0; padding:9px 12px; background:var(--pin); border-radius:12px; border:1px solid color-mix(in srgb, var(--amber) 40%, transparent); }
  .pin p { margin:0 0 2px; overflow-wrap:anywhere; }

  /* chat flow: oldest at the top, newest at the bottom */
  #list { padding:10px 12px 76px; display:flex; flex-direction:column; gap:10px; }
  .day { align-self:center; font-size:.76em; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:2px 12px; margin:6px 0 0; }
  .older { padding:10px 12px 0; text-align:center; }
  .older button { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 16px; color:var(--acc); }

  /* floating pills */
  .pill { position:fixed; z-index:6; inset-inline:0; margin-inline:auto; width:max-content; max-width:calc(100% - 24px);
    border:0; border-radius:999px; padding:8px 16px; box-shadow:0 6px 18px rgba(10,25,60,.28); font-size:.88em; }
  #resume { top:calc(var(--head) + 10px); display:flex; align-items:center; gap:10px; background:var(--card); color:var(--fg); border:1px solid var(--line); padding:6px 8px 6px 14px; }
  #resume b { color:var(--acc); cursor:pointer; font-weight:600; }
  #resume i { font-style:normal; color:var(--muted); cursor:pointer; padding:0 6px; }
  #newPill { bottom:16px; background:var(--navy2); color:#fff; }
  .down { position:fixed; z-index:6; bottom:14px; inset-inline-start:14px; width:40px; height:40px; border-radius:50%; background:var(--card); color:var(--acc); border:1px solid var(--line); box-shadow:0 4px 12px rgba(0,0,0,.25); }

  /* message card */
  .msg { background:var(--card); border-radius:16px; padding:12px 14px; box-shadow:var(--shadow); border:1px solid var(--line); }
  .head { display:flex; align-items:center; gap:10px; }
  .avatar { width:38px; height:38px; border-radius:12px; flex:none; overflow:hidden; background:linear-gradient(135deg, var(--navy1), var(--navy2)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .who { display:flex; flex-direction:column; flex:1; min-width:0; line-height:1.3; }
  .who strong { font-size:1em; }
  .who time { color:var(--muted); font-size:.78em; }
  .permalink { color:var(--muted) !important; display:inline-flex; padding:6px; border-radius:10px; }
  .permalink:hover { background:var(--soft); color:var(--acc) !important; }
  .msg .title { margin:10px 0 0; font-size:1.06em; font-weight:700; line-height:1.4; overflow-wrap:anywhere; }
  .msg p.body { margin:6px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg p.body:first-of-type { margin-top:10px; }
  .media { color:var(--muted); font-style:italic; }
  p.clamp { display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden; }
  .media-box { margin:10px 0 0; color:var(--muted); font-size:.87em; }
  .media-box img, .media-box video { display:block; width:100%; max-height:420px; object-fit:cover; border-radius:12px; }
  .media-box img { cursor:zoom-in; }
  .media-box button { border:1px solid var(--line); background:var(--soft); border-radius:999px; padding:6px 14px; }

  .foot { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
  .reactions { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chip { padding:2px 10px; border-radius:999px; font-size:.88em; border:1px solid var(--line); background:var(--soft); }
  .chip:hover { border-color:var(--acc); }
  .chip.add { color:var(--acc); display:inline-flex; align-items:center; gap:5px; background:transparent; border-color:color-mix(in srgb, var(--acc) 45%, transparent); }
  .tray { display:inline-flex; flex-wrap:wrap; gap:4px; }
  .acts { display:flex; gap:12px; }
  .linkish { border:0; background:none; color:var(--acc); padding:2px 0; font-size:.84em; }
  .linkish:hover { text-decoration:underline; }
  .msg a { color:var(--acc); }
  .report { margin-top:10px; padding:10px; border:1px solid var(--line); border-radius:12px; background:var(--soft); }
  .report textarea { width:100%; font:inherit; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:8px; }
  .row { display:flex; align-items:center; gap:8px; margin:6px 0; flex-wrap:wrap; }
  .report .row { margin:8px 0 0; }
  .report button, #settings button { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:5px 14px; }

  .lightbox { position:fixed; inset:0; background:rgba(5,10,25,.9); display:flex; align-items:center; justify-content:center; z-index:10; cursor:zoom-out; }
  .lightbox img { max-width:96%; max-height:96%; border-radius:10px; }
  #toast { position:fixed; bottom:12px; inset-inline:12px; background:var(--fg); color:var(--bg); padding:10px 14px; border-radius:12px; z-index:11; box-shadow:0 6px 18px rgba(0,0,0,.3); }
  #toast a { color:inherit; text-decoration:underline; }

  /* settings */
  #settings { padding:10px 14px 18px; }
  #settings h2 { font-size:.82em; margin:16px 0 6px; color:var(--muted); letter-spacing:.4px; }
  #settings select, #settings input[type=text], #settings input[type=number] { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:5px 8px; }
  #settings input[type=number] { width:72px; }
  .row input[type=text] { flex:1; min-width:0; direction:ltr; }
</style>
</head>
<body>
<header>
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"/></svg>
  </div>
  <div class="brand" id="brand"><h1>שקיפות <span id="chip" hidden></span></h1><small id="updated">ערוץ חדשות</small></div>
  <div class="tools">
    <button id="refresh" title="רענון" aria-label="רענון">⟳</button>
    <button id="gear" title="הגדרות" aria-label="הגדרות">⚙️</button>
    <button id="openDock" title="פתיחה בחלון" aria-label="פתיחה בחלון" hidden>⤢</button>
    <button id="min" title="מזעור" aria-label="מזעור" hidden>—</button>
    <button id="close" title="סגירה" aria-label="סגירה" hidden>✕</button>
  </div>
</header>

<section id="settings" hidden>
  <h2>התראות</h2>
  <div class="row"><label><input type="checkbox" id="notify"> התראות על הודעות חדשות</label></div>
  <div class="row"><label><input type="checkbox" id="soundOn"> צליל</label>
    <select id="sound"></select><button id="test">נסה</button></div>
  <h2>השתקה</h2>
  <div class="row">השתק ל-
    <input type="number" id="muteN" min="1" max="999" value="1">
    <select id="muteUnit"><option value="m">דקות</option><option value="h" selected>שעות</option><option value="d">ימים</option><option value="w">שבועות</option></select>
    <button id="muteGo">השתק</button>
  </div>
  <div class="row"><button id="muteTomorrow">עד מחר בבוקר</button><button id="muteOff">ביטול השתקה</button></div>
  <div class="row"><span id="muteInfo"></span></div>

  <h2>תצוגה</h2>
  <div class="row">גודל כתב:
    <select id="font"><option value="s">קטן</option><option value="m">רגיל</option><option value="l">גדול</option></select>
  </div>
  <div class="row">עיצוב:
    <select id="theme"><option value="auto">לפי המערכת</option><option value="light">בהיר</option><option value="dark">כהה</option></select>
  </div>
  <div class="row"><label><input type="checkbox" id="showInGmail"> הצג את "שקיפות" בתוך Gmail</label></div>

  <h2>חיבור</h2>
  <div class="row"><label for="base">כתובת האתר</label><input type="text" id="base"></div>
  <div class="row"><small id="diag"></small></div>
  <div class="row"><button id="back">חזרה להודעות</button></div>
</section>

<div id="view">
  <div id="pinned"></div>
  <div class="older"><button id="more" hidden>טעינת הודעות ישנות</button></div>
  <div id="status">טוען…</div>
  <main id="list"></main>
</div>
<div id="resume" class="pill" hidden><span>המשך מהמקום שעצרת</span><b id="resumeGo">↑ המשך</b><i id="resumeX" title="הסתר">✕</i></div>
<button id="newPill" class="pill" hidden>↓ הודעות חדשות</button>
<button id="down" class="down" title="לתחתית" aria-label="לתחתית" hidden>▼</button>
<div id="toast" hidden></div>
<script type="module" src="sidepanel.js"></script>
</body>
</html>
