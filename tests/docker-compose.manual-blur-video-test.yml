# The MANUAL_BLUR_VIDEO flag only (not MANUAL_BLUR) on the local UI test stack:
#   docker compose -p tc-ui -f docker-compose.local.yml -f tests/docker-compose.ui-test.yml -f tests/docker-compose.manual-blur-video-test.yml up -d --build --no-deps redis backend
#   EXPECT_FLAG=on python -I tests/e2e_manual_blur_video.py http://localhost:18083
services:
  backend:
    environment:
      MANUAL_BLUR_VIDEO: "1"
