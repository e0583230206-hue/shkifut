# Runs the local backend on 127.0.0.1:18080 instead of 8080 (8080 may be the SSH tunnel to the demo server: never test against that).
#   docker compose -f docker-compose.local.yml -f tests/docker-compose.port.yml up -d
# Tests: BASE_URL=http://localhost:18080 python -I tests/e2e_hold_videos.py on
services:
  backend:
    ports: !override
      - "127.0.0.1:18080:3000"
