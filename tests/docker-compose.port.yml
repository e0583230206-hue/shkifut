# Runs the local backend on 127.0.0.1:18080. docker-compose.local.yml uses 18080 by itself now, so this override is no longer needed;
# kept for old command lines. Never test against 8080 / 8081 (they may be an SSH tunnel to the demo server: the tests refuse them).
#   docker compose -f docker-compose.local.yml -f tests/docker-compose.port.yml up -d
# Tests: BASE_URL=http://localhost:18080 python -I tests/e2e_hold_videos.py on
services:
  backend:
    ports: !override
      - "127.0.0.1:18080:3000"
