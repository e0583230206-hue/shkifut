<nb-card>
  <nb-card-header>
    הגדרות ערוץ
  </nb-card-header>

  <nb-card-body>
    <div class="mb-3">
      <label for="moderation-level" class="d-block mb-1 fw-bold">רמת החמרה בטשטוש אוטומטי</label>
      <select id="moderation-level" class="form-select form-select-sm w-auto" [ngModel]="moderationLevel"
        (ngModelChange)="setModerationLevel($event)">
        @for (level of moderationLevels; track level.value) {
        <option [value]="level.value">{{ level.label }}</option>
        }
      </select>
      <small class="text-muted d-block mt-1">חל על קבצים חדשים. לקובץ קיים: "בדוק מחדש" ליד הקובץ.</small>
    </div>
    @for (setting of settings; track setting; let i = $index) {
      <div class="d-flex gap-2 mb-2">
        <input nbInput fieldSize="small" type="text" [(ngModel)]="setting.key" placeholder="הגדרה">
        <input nbInput fullWidth fieldSize="small" type="text" [(ngModel)]="setting.value" placeholder="ערך">
        <button nbButton status="danger" size="small" (click)="removeSetting(i)">
          <nb-icon icon="close"></nb-icon>
          מחק
        </button>
      </div>
    }
    <div>
      <button nbButton size="small" status="primary" (click)="settings.push({ key: '', value: '' })">
        <nb-icon icon="plus"></nb-icon>
        הוסף הגדרה
      </button>

    </div>
  </nb-card-body>

  <nb-card-footer>
    <button nbButton status="primary" (click)="saveSettings()" [disabled]="setInProgress">
      שמור
    </button>
  </nb-card-footer>
</nb-card>
